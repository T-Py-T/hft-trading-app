# k8s/overlays/production/secrets.yaml
# Production Secrets Example - USE EXTERNAL SECRET MANAGEMENT IN REAL DEPLOYMENTS
# 
# NOTE: This file shows the structure. In production, use:
#   - AWS Secrets Manager
#   - Azure Key Vault
#   - HashiCorp Vault
#   - Kubernetes Sealed Secrets
#   - External Secrets Operator
#
# Do NOT commit actual secrets to git!

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: hft-trading
type: Opaque
stringData:
  username: trading_user
  password: CHANGE_ME_IN_PRODUCTION
  database: trading_db

---
# Consumed by k8s/base/hft-backend.yaml. The Go server reads
# DATABASE_URL and JWT_SECRET from env (see ml-trading-app-go README).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: hft-trading
type: Opaque
stringData:
  DATABASE_URL: postgres://trading_user:CHANGE_ME_IN_PRODUCTION@postgres:5432/trading_db?sslmode=disable
  JWT_SECRET: CHANGE_ME_IN_PRODUCTION
